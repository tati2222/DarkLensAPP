<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Detalle del Participante - DarkLnes</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .content-box {
      margin-bottom: 30px;
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <h1>Detalle del Participante</h1>
      <p class="subtitle">Vista completa para investigadores</p>
    </header>

    <!-- ===============================
         INFO PARTICIPANTE
         =============================== -->
    <section class="content-box">
      <h2>🧍 Información del Participante</h2>
      <div id="info-participante" class="resultado-box">
        Cargando información...
      </div>
    </section>

    <!-- ===============================
         SD3 RESULTADOS
         =============================== -->
    <section class="content-box">
      <h2>📊 Resultados SD3</h2>
      <div id="resultados-sd3-detalle" class="resultado-box"></div>
      <canvas id="grafico-sd3-resultados" style="max-width:600px; margin: 40px auto;"></canvas>
    </section>

    <!-- ===============================
         TIEMPOS DE RESPUESTA
         =============================== -->
    <section class="content-box">
      <h2>⏱ Tiempos de Respuesta</h2>
      <div id="tiempos-detalle" class="resultado-box"></div>
      <canvas id="grafico-tiempos" style="max-width:600px; margin: 40px auto;"></canvas>
    </section>

    <!-- ===============================
         MICROEXPRESIONES
         =============================== -->
    <section class="content-box">
      <h2>😶 Microexpresiones Detectadas</h2>
      <div id="microexpresiones-detalle" class="resultado-box"></div>
      <canvas id="grafico-emociones" style="max-width:600px; margin: 40px auto;"></canvas>
    </section>

    <!-- ===============================
         FACS
         =============================== -->
    <section class="content-box">
      <h2>🔍 Unidades FACS</h2>
      <div id="facs-detalle" class="resultado-box"></div>
    </section>

    <!-- ===============================
         ANÁLISIS FINAL
         =============================== -->
    <section class="content-box">
      <h2>🧠 Análisis Integrado</h2>
      <div id="analisis-final" class="resultado-box"></div>
    </section>

    <!-- ===============================
         FOTO PARTICIPANTE
         =============================== -->
    <section class="content-box" style="text-align:center;">
      <h2>📷 Imagen del Participante</h2>
      <div id="imagen-participante"></div>
    </section>

    <div style="text-align:center; margin-top:40px;">
      <a href="index.html" class="btn-secondary">Volver al inicio</a>
      <a href="panel.html" class="btn-secondary" style="margin-left:15px;">Volver al panel</a>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
