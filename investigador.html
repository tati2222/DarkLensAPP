<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DARKLENS - Investigador</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>DARKLENS</h1>
      <p class="subtitle">Panel de Investigación - Acceso Restringido</p>
    </div>

    <!-- Sección Login -->
    <div id="seccion-login" class="content-box">
      <h2>🔬 Acceso Investigador</h2>
      <p>Ingresá la contraseña para acceder al panel de investigación.</p>
      
      <form id="form-login" class="login-form">
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required>
        </div>
        
        <div class="button-group">
          <button type="submit" class="btn-primary">Acceder</button>
          <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">Volver al Inicio</button>
        </div>
      </form>
    </div>

    <!-- Dashboard Investigador -->
    <div id="seccion-dashboard" class="hidden">
      <div class="dashboard-header">
        <h2>Panel del Investigador</h2>
        <button id="btn-logout" class="btn-secondary">Cerrar Sesión</button>
      </div>

      <div class="content-box">
        <h3>📊 Estadísticas Generales</h3>
        <div id="estadisticas-generales" class="stats-container">
          <div class="stat-card">
            <h4>Total Participantes</h4>
            <div class="stat-number" id="total-participantes">0</div>
          </div>
          <div class="stat-card">
            <h4>Con Imágenes</h4>
            <div class="stat-number" id="con-imagenes">0</div>
          </div>
          <div class="stat-card">
            <h4>Completados</h4>
            <div class="stat-number" id="completados">0</div>
          </div>
        </div>
      </div>

      <div class="content-box">
        <h3>👥 Lista de Participantes</h3>
        <div class="filtros">
          <input type="text" id="buscar-participante" placeholder="Buscar participante..." class="form-group">
          <select id="filtro-estado" class="form-group">
            <option value="todos">Todos los estados</option>
            <option value="completo">Completado</option>
            <option value="parcial">Parcial</option>
          </select>
        </div>
        
        <div id="lista-participantes" class="participants-list">
          <!-- Los participantes se cargarán aquí -->
        </div>
      </div>

      <div class="content-box">
        <h3>📈 Análisis de Datos</h3>
        <div class="button-group">
          <button id="btn-exportar-datos" class="btn-primary">Exportar Datos CSV</button>
          <button id="btn-analizar-correlaciones" class="btn-secondary">Analizar Correlaciones</button>
        </div>
        
        <div id="resultados-analisis" class="hidden">
          <!-- Resultados del análisis -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/investigador.js"></script>
</body>
</html>
